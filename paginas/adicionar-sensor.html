<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Bootstrap 5.3 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <!-- Fonte sem serifa: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
    <!-- Tema do projeto (sempre por último) -->
    <link rel="stylesheet" href="../css/ferrorama-bootstrap.css">
    <title>Adicionar Sensor</title>
</head>
    
<body class="pg-form">
<div class="tela-label"></div>
 
<div class="card">
  <div class="header">
    <div class="menu-icon">
      <div></div>
      <div></div>
      <div></div>
    </div>
    <h1><i class="bi bi-list"></i>Adicionar Sensor</h1>
  </div>
 
  <div class="field">
    <label for="tipoSensor">Escolha o tipo de sensor</label>
    <div class="select-wrapper">
      <select id="tipoSensor">
        <option>GEL 2747</option>
      </select>
    </div>
  </div>
 
  <div class="field">
    <label for="localSensor">Escolha o local do sensor</label>
    <div class="select-wrapper">
      <select id="localSensor">
        <option>Rota 2</option>
      </select>
    </div>
  </div>
 
  <div class="info-box">
    <span class="icon"><i class="bi bi-info-circle"></i></span>
    <p id="mensagemSensor">O sensor será Adicionado em até 4 semanas</p>
  </div>
 
  <button type="button" class="btn-adicionar">Adicionar</button>
</div>
 
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- JavaScript do projeto (a ordem importa: global -> página). Os dados vêm da API em PHP (pasta api/) -->
    <script src="../js/global.js"></script>
    <script src="../js/sensores.js"></script>
</body>
</html>
