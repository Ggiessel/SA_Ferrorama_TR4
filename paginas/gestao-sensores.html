<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
    <link rel="stylesheet" href="../css/ferrorama-bootstrap.css">
    <title>Gerenciamento de Sensores</title>
</head>
<body class="pg-sensores">

    <h1><i class="bi bi-list"></i>Gerenciamento de Sensores</h1>

    <main class="conteudo">
        <div class="botoes-sensor">
            <button type="button" class="btn-sensor" data-ir="adicionar-sensor.html">
                <i class="bi bi-plus-square"></i>Adicionar novo Sensor
            </button>
            <button type="button" class="btn-sensor" data-ir="remover-sensor.html">
                <i class="bi bi-dash-square"></i>Remover Sensor
            </button>
            <button type="button" class="btn-sensor" data-ir="leituras.html">
                <i class="bi bi-activity"></i>Leituras dos Sensores
            </button>
            <button type="button" class="btn-sensor" data-ir="simulador.html">
                <i class="bi bi-cpu"></i>Simulador de Leituras
            </button>
        </div>

        <section class="card-lista">
            <h2>Histórico de Sensores</h2>
            <ul class="lista-itens" id="listaSensores"></ul>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/global.js"></script>
    <script src="../js/gestao-sensores.js"></script>
</body>
</html>
