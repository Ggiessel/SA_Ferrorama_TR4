<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../vendor/bootstrap/bootstrap.min.css">
    <link rel="stylesheet" href="../vendor/bootstrap-icons/bootstrap-icons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
    <link rel="stylesheet" href="../css/ferrorama-bootstrap.css">
    <link rel="icon" href="../img/logo_TR4.png">
    <title>Rotas e viagens - Ferrorama TR4</title>
</head>
<body class="pg-rotas-v2" data-titulo="Rotas e viagens">
    <main>
        <div class="abas" role="tablist">
            <button type="button" role="tab" id="abaRotas" aria-controls="painelRotas" aria-selected="true">Rotas</button>
            <button type="button" role="tab" id="abaViagens" aria-controls="painelViagens" aria-selected="false">Viagens</button>
        </div>

        <section id="painelRotas" role="tabpanel" aria-labelledby="abaRotas">
            <div class="barra-modulo">
                <p class="descricao">Rotas atendidas, horários de partida e trens alocados.</p>
                <div class="acoes-modulo"><button type="button" class="btn-primario somente-gestor" id="btnNovaRota" hidden><i class="bi bi-plus-lg"></i> Nova rota</button></div>
            </div>
            <div class="cartao">
                <form class="filtros" id="filtrosRotas">
                    <div class="campo"><label for="buscaRota">Rota ou cidade</label><input type="search" id="buscaRota" name="busca" placeholder="Ex.: Rota 36, Curitiba"></div>
                    <div class="campo nao-cliente"><label for="filtroAtiva">Situação</label>
                        <select id="filtroAtiva" name="ativa"><option value="">Todas</option><option value="1">Ativa</option><option value="0">Inativa</option></select></div>
                    <div class="campo nao-cliente"><label for="filtroTremRota">Trem</label><select id="filtroTremRota" name="trem_id"></select></div>
                    <div class="acoes-filtro"><button type="submit" class="btn-primario"><i class="bi bi-funnel"></i> Filtrar</button></div>
                </form>
                <div class="table-responsive">
                    <table class="table" id="tabelaRotas">
                        <thead><tr><th>Rota</th><th>Trajeto</th><th>Distância</th><th>Horários</th><th>Trens</th><th>Em andamento</th><th>Situação</th><th>Aviso</th><th>Ações</th></tr></thead>
                        <tbody></tbody>
                    </table>
                </div>
            </div>
        </section>

        <section id="painelViagens" role="tabpanel" aria-labelledby="abaViagens" hidden>
            <div class="barra-modulo">
                <p class="descricao">Viagens programadas, em andamento e concluídas.</p>
                <div class="acoes-modulo"><button type="button" class="btn-primario somente-gestor" id="btnNovaViagem" hidden><i class="bi bi-plus-lg"></i> Nova viagem</button></div>
            </div>
            <div class="cartao">
                <form class="filtros" id="filtrosViagens">
                    <div class="campo"><label for="viagemDataInicial">Data inicial</label><input type="date" id="viagemDataInicial" name="data_inicial"></div>
                    <div class="campo"><label for="viagemDataFinal">Data final</label><input type="date" id="viagemDataFinal" name="data_final"></div>
                    <div class="campo"><label for="filtroStatusViagem">Situação</label>
                        <select id="filtroStatusViagem" name="status"><option value="">Todas</option><option value="ativas">Em curso (andamento + atrasadas)</option><option value="agendada">Agendada</option><option value="em_andamento">Em andamento</option><option value="atrasada">Atrasada</option><option value="concluida">Concluída</option><option value="cancelada">Cancelada</option></select></div>
                    <div class="campo nao-cliente"><label for="filtroTremViagem">Trem</label><select id="filtroTremViagem" name="trem_id"></select></div>
                    <div class="campo"><label for="filtroRotaViagem">Rota</label><select id="filtroRotaViagem" name="rota_id"></select></div>
                    <div class="acoes-filtro"><button type="submit" class="btn-primario"><i class="bi bi-funnel"></i> Filtrar</button><button type="reset" class="btn-secundario">Limpar</button></div>
                </form>
                <div class="table-responsive">
                    <table class="table" id="tabelaViagens">
                        <thead><tr><th>Partida prevista</th><th>Rota</th><th>Trem</th><th>Maquinista</th><th>Chegada prevista</th><th>Partida real</th><th>Chegada real</th><th>Situação</th><th>Ações</th></tr></thead>
                        <tbody></tbody>
                    </table>
                </div>
            </div>
        </section>

        <div class="modal fade" id="modalRota" tabindex="-1" aria-labelledby="tituloModalRota" aria-hidden="true">
            <div class="modal-dialog modal-lg modal-dialog-scrollable">
                <form class="modal-content" id="formRota" novalidate>
                    <div class="modal-header"><h2 id="tituloModalRota">Nova rota</h2><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button></div>
                    <div class="modal-body grade-form">
                        <div class="campo"><label for="nomeRota">Nome</label><input type="text" id="nomeRota" maxlength="30" placeholder="Ex.: Rota 41"></div>
                        <div class="campo"><label for="origemRota">Origem</label><input type="text" id="origemRota" maxlength="80"></div>
                        <div class="campo"><label for="destinoRota">Destino</label><input type="text" id="destinoRota" maxlength="80"></div>
                        <div class="campo"><label for="distanciaRota">Distância (km)</label><input type="number" id="distanciaRota" min="1"></div>
                        <div class="campo"><label for="passageirosRota">Passageiros transportados</label><input type="number" id="passageirosRota" min="0" value="0"></div>
                        <div class="campo"><label for="quilometragemRota">Quilometragem acumulada (km)</label><input type="number" id="quilometragemRota" min="0" value="0"></div>
                        <div class="campo largo"><label for="horariosRota">Horários de partida (separados por vírgula)</label><input type="text" id="horariosRota" placeholder="Ex.: 06:00, 12:30, 18:45"></div>
                        <div class="campo largo"><label for="alertaRota">Aviso aos passageiros (opcional)</label><input type="text" id="alertaRota" maxlength="255"></div>
                        <label class="opcao largo"><input type="checkbox" id="ativaRota" checked> Rota ativa</label>
                    </div>
                    <div class="modal-footer"><button type="button" class="btn-secundario" data-bs-dismiss="modal">Cancelar</button><button type="submit" class="btn-primario" id="btnSalvarRota">Salvar</button></div>
                </form>
            </div>
        </div>

        <div class="modal fade" id="modalViagem" tabindex="-1" aria-labelledby="tituloModalViagem" aria-hidden="true">
            <div class="modal-dialog modal-lg">
                <form class="modal-content" id="formViagem" novalidate>
                    <div class="modal-header"><h2 id="tituloModalViagem">Nova viagem</h2><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button></div>
                    <div class="modal-body grade-form">
                        <div class="campo"><label for="rotaViagem">Rota</label><select id="rotaViagem"></select></div>
                        <div class="campo"><label for="tremViagem">Trem</label><select id="tremViagem"></select></div>
                        <div class="campo"><label for="maquinistaViagem">Maquinista</label><select id="maquinistaViagem"></select></div>
                        <div class="campo"><label for="statusViagem">Situação</label>
                            <select id="statusViagem"><option value="agendada">Agendada</option><option value="em_andamento">Em andamento</option><option value="atrasada">Atrasada</option><option value="concluida">Concluída</option><option value="cancelada">Cancelada</option></select></div>
                        <div class="campo"><label for="partidaViagem">Partida prevista</label><input type="datetime-local" id="partidaViagem"></div>
                        <div class="campo"><label for="chegadaViagem">Chegada prevista</label><input type="datetime-local" id="chegadaViagem"></div>
                        <div class="campo largo"><label for="observacaoViagem">Observação</label><input type="text" id="observacaoViagem" maxlength="255"></div>
                    </div>
                    <div class="modal-footer"><button type="button" class="btn-secundario" data-bs-dismiss="modal">Cancelar</button><button type="submit" class="btn-primario" id="btnSalvarViagem">Salvar</button></div>
                </form>
            </div>
        </div>
    </main>

    <script src="../vendor/bootstrap/bootstrap.bundle.min.js"></script>
    <script src="../js/global.js"></script>
    <script src="../js/rotas.js"></script>
</body>
</html>
