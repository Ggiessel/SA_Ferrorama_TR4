<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
    <link rel="stylesheet" href="../css/ferrorama-bootstrap.css">
    <title>Monitoramento de Cargas</title>
</head>
<body class="pg-monitoramento">

    <h1><i class="bi bi-list"></i>Monitoramento de Cargas</h1>

    <main class="conteudo">
        <div class="mapa-monitor">
            <img src="../img/mapaMonitoramento.png" alt="Mapa com o trajeto da carga em transporte, da origem ao destino">
        </div>

        <section class="painel-monitor">
            <h2 class="titulo-secao">Cargas em transporte</h2>
            <div class="filtro-status" id="filtroStatus" role="group" aria-label="Filtrar cargas por status"></div>
            <ul class="lista-itens" id="listaCargas"></ul>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/global.js"></script>
    <script src="../js/monitoramento.js"></script>
</body>
</html>
