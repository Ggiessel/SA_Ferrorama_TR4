<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../vendor/bootstrap/bootstrap.min.css">
    <link rel="stylesheet" href="../vendor/bootstrap-icons/bootstrap-icons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
    <link rel="stylesheet" href="../css/ferrorama-bootstrap.css">
    <link rel="icon" href="../img/logo_TR4.png">
    <title>Alertas e notificações - Ferrorama TR4</title>
</head>
<body class="pg-alertas-v2" data-titulo="Alertas e notificações">
    <main>
        <div class="barra-modulo">
            <p class="descricao" id="descricaoAlertas">Alertas gerados pelas leituras dos sensores e avisos da operação.</p>
            <div class="acoes-modulo"><button type="button" class="btn-primario nao-cliente" id="btnNovoAlerta" hidden><i class="bi bi-plus-lg"></i> Novo alerta</button></div>
        </div>

        <section class="cartao">
            <form class="filtros" id="filtrosAlertas">
                <div class="campo"><label for="buscaAlerta">Buscar</label><input type="search" id="buscaAlerta" name="busca" placeholder="Texto ou trem"></div>
                <div class="campo"><label for="filtroNivelAlerta">Gravidade</label>
                    <select id="filtroNivelAlerta" name="nivel"><option value="">Todas</option><option value="critico">Crítico</option><option value="atencao">Atenção</option><option value="normal">Normal</option></select></div>
                <div class="campo"><label for="filtroSituacaoAlerta">Situação</label>
                    <select id="filtroSituacaoAlerta" name="situacao"><option value="">Todas</option><option value="ativo" selected>Ativos</option><option value="resolvido">Resolvidos</option></select></div>
                <div class="campo nao-cliente" hidden><label for="filtroTremAlerta">Trem</label><select id="filtroTremAlerta" name="trem_id"></select></div>
                <div class="campo"><label for="alertaDataInicial">Data inicial</label><input type="date" id="alertaDataInicial" name="data_inicial"></div>
                <div class="campo"><label for="alertaDataFinal">Data final</label><input type="date" id="alertaDataFinal" name="data_final"></div>
                <div class="acoes-filtro"><button type="submit" class="btn-primario"><i class="bi bi-funnel"></i> Filtrar</button></div>
            </form>
            <div class="resumo-v2" id="resumoAlertas"></div>
            <div class="lista-alertas" id="listaAlertas" aria-live="polite"></div>
        </section>

        <div class="modal fade" id="modalAlerta" tabindex="-1" aria-labelledby="tituloModalAlerta" aria-hidden="true">
            <div class="modal-dialog">
                <form class="modal-content" id="formAlerta" novalidate>
                    <div class="modal-header"><h2 id="tituloModalAlerta">Novo alerta</h2><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button></div>
                    <div class="modal-body grade-form">
                        <div class="campo"><label for="nivelAlerta">Gravidade</label><select id="nivelAlerta"><option value="">Escolha</option><option value="normal">Normal</option><option value="atencao">Atenção</option><option value="critico">Crítico</option></select></div>
                        <div class="campo"><label for="tremAlerta">Trem</label><select id="tremAlerta"></select></div>
                        <div class="campo largo"><label for="mensagemAlerta">Mensagem</label><textarea id="mensagemAlerta" maxlength="255" rows="3" placeholder="Descreva o problema"></textarea></div>
                        <label class="opcao largo somente-gestor" hidden><input type="checkbox" id="publicoAlerta"> Mostrar também aos clientes (aviso público)</label>
                    </div>
                    <div class="modal-footer"><button type="button" class="btn-secundario" data-bs-dismiss="modal">Cancelar</button><button type="submit" class="btn-primario" id="btnSalvarAlerta">Gerar alerta</button></div>
                </form>
            </div>
        </div>
    </main>

    <script src="../vendor/bootstrap/bootstrap.bundle.min.js"></script>
    <script src="../js/global.js"></script>
    <script src="../js/alertas.js"></script>
</body>
</html>
