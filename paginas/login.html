<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Bootstrap 5.3 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <!-- Fonte sem serifa: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
    <!-- Tema do projeto (sempre por último) -->
    <link rel="stylesheet" href="../css/ferrorama-bootstrap.css">

    <title>Log-in</title>


</head>
<body class="pg-login">
  <div class="page">

    <div class="logo">
        <img src="../img/logoTR4.png" alt="Logo TR4">
    </div>

    <form class="card" id="formLogin" novalidate>

        <h1>Entrar em uma conta</h1>
        <p>Insira seu e-mail e senha para entrar no aplicativo</p>

        <input type="email" id="emailLogin" placeholder="email@dominio.com" autocomplete="email">

        <input type="password" id="senhaLogin" placeholder="Sua senha" autocomplete="current-password">

        <button type="submit" class="btn-primario">Continuar</button>

        <div class="separador">
            <span>ou</span>
        </div>

       <button type="button" class="btn-continuar" data-provedor="Google">
    <i class="bi bi-google"></i>
    <p>Continuar com o Google</p>
</button>

<button type="button" class="btn-continuar" data-provedor="Apple">
    <i class="bi bi-apple"></i>
    <p>Continuar com a Apple</p>
</button>

        <p class="termos">
            Ao clicar em continuar, você concorda com os nossos Termos de Serviço e com a Política de Privacidade 
        </p>
    </form>


    <p class="rodape">
    Não tem conta? <a href="signin.html">Cadastre-se</a>
</p>
  </div>  
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- JavaScript do projeto (a ordem importa: global -> página). Os dados vêm da API em PHP (pasta api/) -->
    <script src="../js/global.js"></script>
    <script src="../js/login.js"></script>
</body>
</html>
