<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../vendor/bootstrap/bootstrap.min.css">
    <link rel="stylesheet" href="../vendor/bootstrap-icons/bootstrap-icons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
    <link rel="stylesheet" href="../css/ferrorama-bootstrap.css">

    <title>Entrar - Ferrorama TR4</title>

</head>
<body class="pg-login">
  <div class="page">

    <div class="logo">
        <img src="../img/logoTR4.png" alt="Logo TR4">
    </div>

    <form class="card" id="formLogin" novalidate>

        <h1>Entrar em uma conta</h1>
        <p>Insira seu e-mail e senha para entrar no sistema</p>

        <label class="visually-hidden" for="emailLogin">E-mail</label>
        <input type="email" id="emailLogin" placeholder="email@dominio.com" autocomplete="email">

        <label class="visually-hidden" for="senhaLogin">Senha</label>
        <input type="password" id="senhaLogin" placeholder="Sua senha" autocomplete="current-password">

        <button type="submit" class="btn-primario">Continuar</button>

        <p class="termos">
            <a href="#" id="linkEsqueci">Esqueci minha senha</a>
        </p>
    </form>

    <form class="card mt-3" id="formRecuperar" novalidate hidden>
        <h1>Recuperar senha</h1>
        <p>Informe seu e-mail. O gestor do sistema será avisado e vai gerar uma senha temporária para você.</p>
        <label class="visually-hidden" for="emailRecuperar">E-mail</label>
        <input type="email" id="emailRecuperar" placeholder="email@dominio.com" autocomplete="email">
        <button type="submit" class="btn-primario">Enviar pedido</button>
        <p class="termos"><a href="#" id="linkVoltarLogin">Voltar para o login</a></p>
    </form>

    <p class="rodape">
    Não tem conta? <a href="signin.html">Cadastre-se</a>
</p>
  </div>  
    <script src="../vendor/bootstrap/bootstrap.bundle.min.js"></script>
    <script src="../js/global.js"></script>
    <script src="../js/login.js"></script>
</body>
</html>
