<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
    <link rel="stylesheet" href="../css/ferrorama-bootstrap.css">
    <title>Perfil do Usuário</title>
</head>
<body class="pg-perfil pg-perfil-pessoal">

    <h1><i class="bi bi-list"></i>Perfil</h1>

    <main class="conteudo">
        <div class="avatar" aria-hidden="true">
            <i class="bi bi-person-fill"></i>
        </div>
        <p class="nome-usuario"><span id="nomeExibicao">Usuário</span> <i class="bi bi-pencil" aria-hidden="true"></i></p>

        <section class="dados-pessoais">
            <h2>Informações Pessoais</h2>
            <div class="linha-perfil">
                <i class="bi bi-star" aria-hidden="true"></i>
                <label for="nome">Nome Completo</label>
                <input type="text" id="nome">
            </div>
            <div class="linha-perfil">
                <i class="bi bi-star" aria-hidden="true"></i>
                <label for="nascimento">Data de Nascimento</label>
                <input type="date" id="nascimento">
            </div>
            <div class="linha-perfil">
                <i class="bi bi-star" aria-hidden="true"></i>
                <label for="ativo_desde">Ativo desde</label>
                <input type="date" id="ativo_desde" readonly>
            </div>
            <hr>
            <div class="linha-perfil">
                <i class="bi bi-star" aria-hidden="true"></i>
                <label for="email">E-mail</label>
                <input type="email" id="email">
            </div>
            <div class="linha-perfil">
                <i class="bi bi-star" aria-hidden="true"></i>
                <label for="telefone">Telefone de Contato</label>
                <input type="tel" id="telefone">
            </div>
        </section>

        <div class="acoes">
            <button type="button" class="btn-primario btn-grande" onclick="salvar()">Salvar</button>
            <button type="button" class="btn-primario btn-grande" onclick="descartar()">Descartar alterações</button>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/global.js"></script>
    <script src="../js/perfil-pessoal.js"></script>
</body>
</html>
