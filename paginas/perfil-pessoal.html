<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../vendor/bootstrap/bootstrap.min.css">
    <link rel="stylesheet" href="../vendor/bootstrap-icons/bootstrap-icons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
    <link rel="stylesheet" href="../css/ferrorama-bootstrap.css">
    <link rel="icon" href="../img/logo_TR4.png">
    <title>Meu perfil - Ferrorama TR4</title>
</head>
<body class="pg-perfil-v2" data-titulo="Meu perfil">
    <main>
        <div class="aviso-pagina" id="avisoTrocar" hidden><i class="bi bi-shield-lock"></i> Sua senha é temporária. Crie uma nova senha para continuar usando o sistema.</div>
        <div class="grade-2">
            <section class="cartao">
                <h2><i class="bi bi-person-vcard"></i> Informações pessoais</h2>
                <form class="grade-form" id="formPerfil" novalidate>
                    <div class="campo largo"><label for="nome">Nome completo</label><input type="text" id="nome" maxlength="100"></div>
                    <div class="campo"><label for="email">E-mail</label><input type="email" id="email" maxlength="120"></div>
                    <div class="campo"><label for="telefone">Telefone</label><input type="tel" id="telefone" maxlength="20"></div>
                    <div class="campo"><label for="nascimento">Nascimento</label><input type="date" id="nascimento"></div>
                    <div class="campo"><label for="ativo_desde">Ativo desde</label><input type="date" id="ativo_desde" readonly></div>
                    <div class="campo"><label for="perfilAcesso">Perfil de acesso</label><input type="text" id="perfilAcesso" readonly></div>
                    <div class="campo"><label for="tremPerfil">Trem</label><input type="text" id="tremPerfil" readonly></div>
                    <div class="largo d-flex flex-wrap gap-2">
                        <button type="submit" class="btn-primario" id="btnSalvarPerfil">Salvar alterações</button>
                        <button type="button" class="btn-secundario" id="btnDescartar">Descartar</button>
                    </div>
                </form>
            </section>
            <section class="cartao" id="cartaoSenha">
                <h2><i class="bi bi-key"></i> Alterar senha</h2>
                <form class="grade-form" id="formSenha" novalidate>
                    <div class="campo largo"><label for="senhaAtual">Senha atual</label><input type="password" id="senhaAtual" autocomplete="current-password"></div>
                    <div class="campo"><label for="novaSenha">Nova senha</label><input type="password" id="novaSenha" autocomplete="new-password" placeholder="Mínimo 6 caracteres"></div>
                    <div class="campo"><label for="confirmacaoSenha">Confirmar nova senha</label><input type="password" id="confirmacaoSenha" autocomplete="new-password"></div>
                    <div class="largo"><button type="submit" class="btn-primario" id="btnSalvarSenha">Alterar senha</button></div>
                </form>
            </section>
        </div>
    </main>

    <script src="../vendor/bootstrap/bootstrap.bundle.min.js"></script>
    <script src="../js/global.js"></script>
    <script src="../js/perfil-pessoal.js"></script>
</body>
</html>
