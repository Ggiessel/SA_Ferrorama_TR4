<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Bootstrap 5.3 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <!-- Fonte sem serifa: Inter -->

<body class="pg-perfil">  
    <h1><i class="bi bi-list"></i>Perfil do Usuário</h1>
    <div class="dados-pessoais">
<h2>Dados pessoais</h2>
<label for="nome">Nome completo</label>
<input type="text" id="nome">

<label for="nascimento">Data de nascimento</label>
<input type="text" id="nascimento">

<label for="ativoDesde">Ativo desde</label>
<input type="text" id="ativoDesde">

<label for="email">Email</label>

<label for="telefone">Telefone de contato</label>
<input type="text" id="telefone">

    </div>
     <div class="button">
            <button type="button" onclick="descartar()">Descartar</button>
            <button type="button" onclick="salvar()">Salvar</button>
        </div>
