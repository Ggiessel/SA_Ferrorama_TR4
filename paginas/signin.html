<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
    <link rel="stylesheet" href="../css/ferrorama-bootstrap.css">

    <title>Sign-In</title>

</head>

<body class="pg-signin">

    <div class="page">

        <div class="logo">
            <img src="../img/logo2TR4.png" alt="Logo TR4">
        </div>

        <form class="card" id="formCadastro" novalidate>

            <h1>Criar uma conta</h1>

            <p class="descricao">
                Insira seu e-mail para se cadastrar neste aplicativo
            </p>

            <input type="text" id="nomeCadastro" placeholder="Seu nome completo" autocomplete="name">

            <div class="input-email">
                <input type="email" id="emailCadastro" placeholder="Insira seu e-mail" autocomplete="email">
                <span class="google-icon">G</span>
            </div>

            <input type="password" id="senhaCadastro" class="senha" placeholder="Insira sua senha (mínimo 6 caracteres)" autocomplete="new-password">

            <button type="submit" class="btn-primario">Continuar</button>

            <p class="termos">
                Ao clicar em continuar, você concorda com os nossos
                Termos de Serviço e com a Política de Privacidade
            </p>

        </form>

        <p class="rodape">
            Já tem conta? <a href="login.html">Entrar</a>
        </p>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/global.js"></script>
    <script src="../js/signin.js"></script>
</body>
</html>
