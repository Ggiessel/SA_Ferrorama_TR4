<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../vendor/bootstrap/bootstrap.min.css">
    <link rel="stylesheet" href="../vendor/bootstrap-icons/bootstrap-icons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
    <link rel="stylesheet" href="../css/ferrorama-bootstrap.css">

    <title>Criar conta - Ferrorama TR4</title>

</head>

<body class="pg-signin">

    <div class="page">

        <div class="logo">
            <img src="../img/logoTR4.png" alt="Logo TR4">
        </div>

        <form class="card" id="formCadastro" novalidate>

            <h1>Criar uma conta</h1>

            <p class="descricao">
                Crie sua conta de usuário para consultar rotas, horários, cargas e avisos
            </p>

            <input type="text" id="nomeCadastro" placeholder="Seu nome completo" autocomplete="name">

            <input type="email" id="emailCadastro" placeholder="Insira seu e-mail" autocomplete="email">

            <input type="password" id="senhaCadastro" class="senha" placeholder="Insira sua senha (mínimo 6 caracteres)" autocomplete="new-password">

            <input type="password" id="confirmacaoCadastro" class="senha" placeholder="Confirme sua senha" autocomplete="new-password">

            <button type="submit" class="btn-primario">Continuar</button>

            <p class="termos">
                A conta é criada com o perfil de usuário comum (cliente). Perfis de maquinista e gestor são definidos pelo gestor do sistema.
            </p>

        </form>

        <p class="rodape">
            Já tem conta? <a href="login.html">Entrar</a>
        </p>

    </div>

    <script src="../vendor/bootstrap/bootstrap.bundle.min.js"></script>
    <script src="../js/global.js"></script>
    <script src="../js/signin.js"></script>
</body>
</html>
