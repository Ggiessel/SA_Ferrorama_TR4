<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
    <link rel="stylesheet" href="../css/ferrorama-bootstrap.css">
    <title>Manutenção</title>
</head>
<body class="pg-form pg-form-duplo">

    <h1><i class="bi bi-list"></i>Manutenção</h1>

    <main class="conteudo">
        <div class="campo">
            <label for="codigoTrem">Informe o código do trem:</label>
            <input type="text" id="codigoTrem" placeholder="EX: 008" inputmode="numeric" maxlength="3">
        </div>

        <div class="campo">
            <label for="rotaManutencao">Informe qual era a rota:</label>
            <select id="rotaManutencao"></select>
        </div>

        <div class="campo">
            <label for="cargaManutencao">Informe qual era a carga:</label>
            <select id="cargaManutencao"></select>
        </div>

        <div class="campo">
            <label for="causaManutencao">Informe a causa:</label>
            <input type="text" id="causaManutencao" placeholder="EX: Batida">
        </div>

        <div class="acoes">
            <button type="button" class="btn-primario btn-grande save-btn">Enviar</button>
            <button type="button" class="btn-secundario pdf-btn">Salvar como PDF</button>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/global.js"></script>
    <script src="../js/manutencao.js"></script>
</body>
</html>
