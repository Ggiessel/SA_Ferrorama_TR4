<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Bootstrap 5.3 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <!-- Fonte sem serifa: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
    <!-- Tema do projeto (sempre por último) -->
    <link rel="stylesheet" href="../css/ferrorama-bootstrap.css">
    <title>Manutenção</title>
</head>
    
<body class="pg-form">
<div class="tela-label"></div>
 
<div class="card">
  <div class="header">
    <div class="menu-icon">
      <div></div>
      <div></div>
      <div></div>
    </div>
    <h1><i class="bi bi-list"></i>Manutenção</h1>
  </div>

   <div class="content">
        <div class="left-col">
          <label class="first" for="codigoTrem">Informe o código do trem:</label>
          <input type="text" id="codigoTrem" placeholder="EX: 008" inputmode="numeric" maxlength="3">
        </div>
    </div>

  <div class="field">
    <label for="rotaManutencao">Informe qual era a rota:</label>
    <div class="select-wrapper">
      <select id="rotaManutencao">
        <option>Rota 31</option>
      </select>
    </div>
  </div>
 
  <div class="field">
    <label for="cargaManutencao">Informe qual era a carga:</label>
    <div class="select-wrapper">
      <select id="cargaManutencao">
        <option>Sacos de milho</option>
      </select>
    </div>
  </div>

     <div class="content">
        <div class="left-col">
          <label class="first" for="causaManutencao">Informe a causa:</label>
          <input type="text" id="causaManutencao" placeholder="EX: Batida">
        </div>
    </div>

      <div class="right-col">
        <div>
          <button type="button" class="pdf-btn">Salvar como PDF</button>
          </div>
          <div>
          <button type="button" class="save-btn">Salvar</button>
        </div>
        </div>
    </div>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- JavaScript do projeto (a ordem importa: global -> página). Os dados vêm da API em PHP (pasta api/) -->
    <script src="../js/global.js"></script>
    <script src="../js/manutencao.js"></script>
</body>
</html>
