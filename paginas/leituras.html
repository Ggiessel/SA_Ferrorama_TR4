<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
    <link rel="stylesheet" href="../css/ferrorama-bootstrap.css">
    <title>Leituras dos Sensores</title>
</head>
<body class="pg-leituras">
    <h1><i class="bi bi-arrow-left-short"></i>Leituras dos Sensores</h1>

    <form class="filtros" id="filtrosLeituras">
        <div class="campo">
            <label for="filtroTrem">Trem</label>
            <select id="filtroTrem"></select>
        </div>

        <label class="opcao">
            <input type="checkbox" id="somenteFalha">
            Mostrar só leituras com falha
        </label>

        <div class="acoes-filtro">
            <button type="submit" class="btn-primario">Filtrar</button>
            <a href="#" id="linkCsv" class="btn-secundario">Exportar CSV</a>
        </div>
    </form>

    <p class="apoio" id="limitesLeituras"></p>

    <section class="bloco-relatorio">
        <div class="table-responsive">
            <table class="table" id="tabelaLeituras">
                <thead>
                    <tr><th>Data e hora</th><th>Trem</th><th>Velocidade</th><th>Temperatura</th><th>Consumo</th><th>Vibração</th><th>Situação</th></tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/global.js"></script>
    <script src="../js/leituras.js"></script>
</body>
</html>
