<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../vendor/bootstrap/bootstrap.min.css">
    <link rel="stylesheet" href="../vendor/bootstrap-icons/bootstrap-icons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
    <link rel="stylesheet" href="../css/ferrorama-bootstrap.css">
    <link rel="icon" href="../img/logo_TR4.png">
    <title>Leituras - Ferrorama TR4</title>
</head>
<body class="pg-leituras-v2" data-titulo="Leituras">
    <main>
        <div class="barra-modulo">
            <p class="descricao">Histórico de leituras dos sensores, classificadas como Normal, Atenção ou Crítico.</p>
            <div class="acoes-modulo">
                <button type="button" class="btn-secundario" id="btnCsvLeituras"><i class="bi bi-filetype-csv"></i> Exportar CSV</button>
                <button type="button" class="btn-primario" id="btnNovaLeitura"><i class="bi bi-plus-lg"></i> Registrar leitura</button>
            </div>
        </div>

        <section class="cartao">
            <form class="filtros" id="filtrosLeituras">
                <div class="campo"><label for="filtroTrem">Trem</label><select id="filtroTrem" name="trem_id"></select></div>
                <div class="campo"><label for="filtroSensor">Sensor</label><select id="filtroSensor" name="sensor_id"></select></div>
                <div class="campo"><label for="filtroChave">Grandeza</label><select id="filtroChave" name="chave"></select></div>
                <div class="campo"><label for="filtroNivel">Nível</label>
                    <select id="filtroNivel" name="nivel"><option value="">Todos</option><option value="normal">Normal</option><option value="atencao">Atenção</option><option value="critico">Crítico</option></select></div>
                <div class="campo"><label for="dataInicial">Data inicial</label><input type="date" id="dataInicial" name="data_inicial"></div>
                <div class="campo"><label for="dataFinal">Data final</label><input type="date" id="dataFinal" name="data_final"></div>
                <div class="acoes-filtro">
                    <button type="submit" class="btn-primario"><i class="bi bi-funnel"></i> Filtrar</button>
                    <button type="reset" class="btn-secundario">Limpar</button>
                </div>
            </form>

            <div class="resumo-v2" id="resumoLeituras"></div>
            <p class="apoio" id="avisoLimite"></p>

            <div class="table-responsive">
                <table class="table" id="tabelaLeituras">
                    <thead>
                        <tr><th>Data e hora</th><th>Trem</th><th>Sensor</th><th>Grandeza</th><th>Valor</th><th>Nível</th></tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </section>

        <div class="modal fade" id="modalLeitura" tabindex="-1" aria-labelledby="tituloModalLeitura" aria-hidden="true">
            <div class="modal-dialog">
                <form class="modal-content" id="formLeitura" novalidate>
                    <div class="modal-header">
                        <h2 id="tituloModalLeitura">Registrar leitura</h2>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
                    </div>
                    <div class="modal-body grade-form">
                        <div class="campo largo"><label for="sensorLeitura">Sensor ativo</label><select id="sensorLeitura"></select></div>
                        <div class="campo largo"><label for="valorLeitura">Valor medido</label><input type="number" step="0.01" id="valorLeitura" placeholder="Ex.: 72,5"></div>
                        <p class="apoio largo">A leitura é gravada com a data e hora atuais e classificada pelos limites do sistema.</p>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn-secundario" data-bs-dismiss="modal">Cancelar</button>
                        <button type="submit" class="btn-primario" id="btnSalvarLeitura">Registrar</button>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <script src="../vendor/bootstrap/bootstrap.bundle.min.js"></script>
    <script src="../js/global.js"></script>
    <script src="../js/leituras.js"></script>
</body>
</html>
