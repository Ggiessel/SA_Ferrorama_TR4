
<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
    <link rel="stylesheet" href="../css/ferrorama-bootstrap.css">
    <title>Perfil do Funcionário</title>
</head>

<body class="pg-perfil">
    <h1><i class="bi bi-arrow-left-short"></i>Perfil do Funcionário</h1>
    <div class="perfil-funcionario">
        <b> Informações Pessoais </b>
        <div class="cargoatual-funcionario">
            <input type="text" id="cargo" placeholder="Cargo atual" aria-label="Cargo atual">

        </div>
        <div class="nome-funcionario">
            <input type="text" id="nome" placeholder="Nome" aria-label="Nome">
            <input type="date" id="ativo_desde" aria-label="Ativo desde">
        </div>
        <div class="email-funcionario">
            <input type="email" id="email" placeholder="Email" aria-label="Email">
        </div>
        <div class="telefone-funcionario">
            <input type="text" id="telefone" placeholder="Telefone" aria-label="Telefone">
        </div>
        <div class="CPF">
            <input type="text" id="cpf" placeholder="CPF" aria-label="CPF">
        </div>
        <div class="data-nascimento">
            <input type="date" id="nascimento" aria-label="Data de nascimento">
        </div>
        <div class="endereco">
            <input type="text" id="endereco" placeholder="Endereço" aria-label="Endereço">
        </div>
        <div class="button">
            <button type="button" onclick="descartar()">Descartar</button>
            <button type="button" onclick="salvar()">Salvar</button>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/global.js"></script>
    <script src="../js/perfil-funcionario.js"></script>
</body>

</html>
