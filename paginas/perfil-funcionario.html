<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
    <link rel="stylesheet" href="../css/ferrorama-bootstrap.css">
    <title>Perfil do Funcionário</title>
</head>
<body class="pg-perfil">

    <h1><i class="bi bi-arrow-left-short"></i>Perfil</h1>

    <main class="conteudo">
        <div class="banner-perfil" aria-hidden="true">
            <i class="bi bi-person"></i>
        </div>

        <section class="perfil-funcionario">
            <h2>Informações</h2>

            <div class="campo-perfil span-4">
                <label for="cargo">Cargo atual</label>
                <input type="text" id="cargo">
            </div>
            <div class="campo-perfil span-3">
                <label for="nome">Nome</label>
                <input type="text" id="nome">
            </div>
            <div class="campo-perfil span-3">
                <label for="ativo_desde">Ativo desde</label>
                <input type="date" id="ativo_desde">
            </div>
            <div class="campo-perfil span-6">
                <label for="email">E-mail</label>
                <input type="email" id="email">
            </div>
            <div class="campo-perfil span-4">
                <label for="telefone">Telefone</label>
                <input type="tel" id="telefone">
            </div>
            <div class="campo-perfil span-4">
                <label for="cpf">CPF</label>
                <input type="text" id="cpf">
            </div>
            <div class="campo-perfil span-4">
                <label for="nascimento">Data de Nascimento</label>
                <input type="date" id="nascimento">
            </div>
            <div class="campo-perfil span-6">
                <label for="endereco">Endereço</label>
                <input type="text" id="endereco">
            </div>
        </section>

        <div class="acoes">
            <button type="button" class="btn-primario btn-grande" onclick="salvar()">Salvar</button>
            <button type="button" class="btn-primario btn-grande" onclick="descartar()">Descartar alterações</button>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/global.js"></script>
    <script src="../js/perfil-funcionario.js"></script>
</body>
</html>
