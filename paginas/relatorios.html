<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
    <link rel="stylesheet" href="../css/ferrorama-bootstrap.css">
    <title>Relatórios e Análises</title>
</head>
<body class="pg-relatorios">
    <h1><i class="bi bi-list"></i> Relatórios e Análises </h1>

    <div class="resumo-relatorio" id="resumoRelatorio"></div>

    <section class="bloco-relatorio">
        <h2>Cargas cadastradas</h2>
        <div class="table-responsive">
            <table class="table" id="tabelaCargas">
                <thead>
                    <tr><th>Carga</th><th>Tamanho</th><th>Destino</th><th>Partida</th><th>Status</th></tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </section>

    <section class="bloco-relatorio">
        <h2>Manutenções registradas</h2>
        <div class="table-responsive">
            <table class="table" id="tabelaManutencoes">
                <thead>
                    <tr><th>Trem</th><th>Rota</th><th>Carga</th><th>Causa</th><th>Data</th></tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </section>

    <div class="acoes">
        <button type="button" id="btnImprimir" class="btn-primario btn-grande pdf-btn">Salvar como PDF</button>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/global.js"></script>
    <script src="../js/relatorios.js"></script>
</body>
</html>
