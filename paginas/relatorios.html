<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../vendor/bootstrap/bootstrap.min.css">
    <link rel="stylesheet" href="../vendor/bootstrap-icons/bootstrap-icons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
    <link rel="stylesheet" href="../css/ferrorama-bootstrap.css">
    <link rel="icon" href="../img/logo_TR4.png">
    <title>Relatórios - Ferrorama TR4</title>
</head>
<body class="pg-relatorios-v2" data-titulo="Relatórios">
    <main>
        <div class="abas" role="tablist" id="abasRelatorio">
            <button type="button" role="tab" data-tipo="desempenho" aria-selected="true">Desempenho operacional</button>
            <button type="button" role="tab" data-tipo="energia" aria-selected="false">Consumo de energia</button>
            <button type="button" role="tab" data-tipo="eficiencia" aria-selected="false">Eficiência operacional</button>
            <button type="button" role="tab" data-tipo="manutencao" aria-selected="false">Manutenção</button>
        </div>

        <section class="cartao" role="tabpanel">
            <div class="cabecalho-impressao" id="cabecalhoImpressao"></div>
            <div class="barra-modulo">
                <h2 class="m-0 fs-5 fw-bold" id="tituloRelatorio">Desempenho operacional</h2>
                <div class="acoes-modulo">
                    <button type="button" class="btn-secundario" id="btnCsv"><i class="bi bi-filetype-csv"></i> Exportar CSV</button>
                    <button type="button" class="btn-secundario" id="btnImprimir"><i class="bi bi-printer"></i> Imprimir</button>
                </div>
            </div>

            <form class="filtros" id="filtrosRelatorio">
                <div class="campo"><label for="dataInicial">Data inicial</label><input type="date" id="dataInicial" name="data_inicial"></div>
                <div class="campo"><label for="dataFinal">Data final (inclusiva)</label><input type="date" id="dataFinal" name="data_final"></div>
                <div class="campo somente-gestor" hidden><label for="relTrem">Trem</label><select id="relTrem" name="trem_id"></select></div>
                <div class="campo somente-manutencao" hidden><label for="relStatus">Situação</label>
                    <select id="relStatus" name="status"><option value="">Todas</option><option value="aberta">Aberta</option><option value="em_andamento">Em andamento</option><option value="concluida">Concluída</option></select></div>
                <div class="campo somente-manutencao" hidden><label for="relTipo">Tipo</label>
                    <select id="relTipo" name="tipo_manutencao"><option value="">Todos</option><option value="preventiva">Preventiva</option><option value="corretiva">Corretiva</option></select></div>
                <div class="acoes-filtro"><button type="submit" class="btn-primario"><i class="bi bi-funnel"></i> Gerar relatório</button></div>
            </form>

            <div class="resumo-v2" id="resumoRelatorio"></div>
            <p class="apoio" id="observacaoRelatorio"></p>
            <div class="table-responsive">
                <table class="table" id="tabelaRelatorio"><thead><tr></tr></thead><tbody></tbody></table>
            </div>
        </section>
    </main>

    <script src="../vendor/bootstrap/bootstrap.bundle.min.js"></script>
    <script src="../js/global.js"></script>
    <script src="../js/relatorios.js"></script>
</body>
</html>
