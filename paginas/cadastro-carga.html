<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
    <link rel="stylesheet" href="../css/ferrorama-bootstrap.css">
    <title>cadastro de cargas</title>

</head>

<body class="pg-carga">
    <h1><i class="bi bi-list"></i> Cadastro de Cargas </h1>

    <div class="formulario">
        <div>
            <div>
                <b> Escolha a carga do trem: </b>
                <div class="select-wrapper">
                    <select id="tipoCarga" aria-label="Carga do trem">
                        <option>Carvão</option>
                    </select>
                </div>
            </div>
            <div>
                <b> Escolha o tamanho da carga: </b>
                <div class="select-wrapper">
                    <select id="tamanhoCarga" aria-label="Tamanho da carga">
                        <option>2 toneladas</option>
                    </select>
                </div>
            </div>
            <div>
                <b> Escolha o destino da carga: </b>
                <div class="select-wrapper">
                    <select id="destinoCarga" aria-label="Destino da carga">
                        <option>São Paulo</option>
                    </select>
                </div>
            </div>
            <div>
                <b> Escolha a data de partida: </b>
                <input type="date" id="dataPartida" aria-label="Data de partida">
            </div>
        </div>

        <button type="button" class="btn-salvar">Salvar</button>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/global.js"></script>
    <script src="../js/cadastro-carga.js"></script>
</body>
</html>
