<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
    <link rel="stylesheet" href="../css/ferrorama-bootstrap.css">
    <title>Cadastro de Cargas</title>
</head>
<body class="pg-form pg-form-duplo">

    <h1><i class="bi bi-list"></i>Cadastro de Cargas</h1>

    <main class="conteudo">
        <div class="campo">
            <label for="tipoCarga">Escolha a carga do trem:</label>
            <select id="tipoCarga"></select>
        </div>

        <div class="campo">
            <label for="tamanhoCarga">Escolha o tamanho da carga:</label>
            <select id="tamanhoCarga"></select>
        </div>

        <div class="campo">
            <label for="destinoCarga">Escolha o destino da carga:</label>
            <select id="destinoCarga"></select>
        </div>

        <div class="campo">
            <label for="dataPartida">Escolha a data de partida:</label>
            <input type="date" id="dataPartida">
        </div>

        <div class="acoes">
            <button type="button" class="btn-primario btn-grande btn-salvar">Salvar</button>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/global.js"></script>
    <script src="../js/cadastro-carga.js"></script>
</body>
</html>
