<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
    <link rel="stylesheet" href="../css/ferrorama-bootstrap.css">
    <title>Simulador de Leituras</title>
</head>
<body class="pg-form pg-form-duplo">
    <h1><i class="bi bi-arrow-left-short"></i>Simulador de Leituras</h1>

    <main class="conteudo">
        <div class="campo">
            <label for="tremSimulador">Escolha o trem:</label>
            <select id="tremSimulador"></select>
        </div>

        <div class="campo">
            <label for="quantidadeSimulador">Quantidade de leituras:</label>
            <input type="number" id="quantidadeSimulador" min="1" max="200" value="50">
        </div>

        <div class="info-box">
            <i class="bi bi-info-circle"></i>
            <p>Gera uma leitura a cada cinco minutos, terminando no horário atual. Substitui os sensores físicos enquanto eles não enviam dados.</p>
        </div>

        <div class="acoes">
            <button type="button" class="btn-primario btn-grande btn-simular">Gerar leituras</button>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/global.js"></script>
    <script src="../js/simulador.js"></script>
</body>
</html>
