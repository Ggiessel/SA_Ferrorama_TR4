<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
    <link rel="stylesheet" href="../css/ferrorama-bootstrap.css">
    <title>Adicionar Rotas</title>
</head>
<body class="pg-form pg-cadastro">
    <h1><i class="bi bi-list"></i>Adicionar Rotas</h1>

    <main class="conteudo">
        <form id="formRota" class="grade-campos" novalidate>
            <div class="campo">
                <label for="nomeRota">Nome da rota:</label>
                <input type="text" id="nomeRota" placeholder="EX: Rota 40" maxlength="30">
            </div>

            <div class="campo">
                <label for="quilometragemRota">Quilometragem (km):</label>
                <input type="number" id="quilometragemRota" placeholder="EX: 3200" min="1">
            </div>

            <div class="campo">
                <label for="origemRota">Cidade de origem:</label>
                <input type="text" id="origemRota" placeholder="EX: Joinville" maxlength="80">
            </div>

            <div class="campo">
                <label for="destinoRota">Cidade de destino:</label>
                <input type="text" id="destinoRota" placeholder="EX: Curitiba" maxlength="80">
            </div>

            <div class="campo">
                <label for="passageirosRota">Passageiros transportados:</label>
                <input type="number" id="passageirosRota" placeholder="EX: 900" min="0">
            </div>

            <div class="campo">
                <label for="horariosRota">Horários de partida:</label>
                <input type="text" id="horariosRota" placeholder="EX: 07:30, 13:00, 18:45">
            </div>

            <div class="campo campo-largo">
                <label for="alertaRota">Aviso da rota (opcional):</label>
                <input type="text" id="alertaRota" placeholder="EX: Obras no km 40, velocidade reduzida." maxlength="255">
            </div>

            <div class="acoes">
                <button type="submit" id="btnSalvarRota" class="btn-primario btn-grande">Cadastrar</button>
                <button type="button" id="btnCancelarRota" class="btn-secundario" hidden>Cancelar edição</button>
            </div>
        </form>

        <section class="card-lista">
            <h2>Rotas cadastradas</h2>
            <div class="table-responsive">
                <table class="table" id="tabelaRotas">
                    <thead>
                        <tr><th>Nome</th><th>Origem</th><th>Destino</th><th>Quilometragem</th><th>Passageiros</th><th>Ações</th></tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/global.js"></script>
    <script src="../js/adicionar-rota.js"></script>
</body>
</html>
