<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
    <link rel="stylesheet" href="../css/ferrorama-bootstrap.css">
    <title>Remover Sensor</title>
</head>

<body class="pg-form">
<div class="tela-label"></div>

<div class="card">
  <div class="header">
    <div class="menu-icon">
      <div></div>
      <div></div>
      <div></div>
    </div>
    <h1><i class="bi bi-list"></i>Remover Sensor</h1>
  </div>

  <div class="field">
    <label for="sensor">Escolha o sensor</label>
    <div class="select-wrapper">
      <select id="sensor"></select>
    </div>
  </div>

  <div class="info-box">
    <span class="icon"><i class="bi bi-info-circle"></i></span>
    <p>O sensor será removido em até 4 semanas.</p>
  </div>

  <button type="button" class="btn-remover">Remover</button>
</div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/global.js"></script>
    <script src="../js/remover-sensor.js"></script>
</body>
</html>
