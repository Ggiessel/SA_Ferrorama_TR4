<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
    <link rel="stylesheet" href="../css/ferrorama-bootstrap.css">
    <title>Remover Sensor</title>
</head>
<body class="pg-form pg-form-sensor">

    <h1><i class="bi bi-list"></i>Remover Sensor</h1>

    <main class="conteudo">
        <div class="campo">
            <label for="sensor">Escolha o sensor</label>
            <select id="sensor"></select>
        </div>

        <div class="info-box">
            <i class="bi bi-info-circle"></i>
            <p>O sensor será removido em até 4 semanas.</p>
        </div>

        <div class="acoes">
            <button type="button" class="btn-primario btn-grande btn-remover">Remover</button>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/global.js"></script>
    <script src="../js/remover-sensor.js"></script>
</body>
</html>
